<title>Aventura do Moai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* layout: one-screen arcade stage — pixel canvas centered, HTML HUD over it, touch pad below (portrait) or floating (landscape) */
:root{
  --bg:#0b141d; --panel:#142231; --line:#2a3f55; --fg:#f4ecdc; --muted:#93a8ba;
  --gold:#f2b441; --gold-deep:#7a3a12; --coral:#ef6a4c;
  --ui:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:10px;box-sizing:border-box}
.stage{position:relative;width:320px;height:240px;background:#000;box-shadow:0 0 0 2px var(--line),0 18px 40px rgba(0,0,0,.45);border-radius:4px;overflow:hidden;--u:1px}
canvas#game{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated}
.hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;padding:calc(var(--u)*6) calc(var(--u)*10);font-size:calc(var(--u)*8);line-height:1.2;color:#fff;text-shadow:0 calc(var(--u)*1) 0 rgba(0,0,0,.6);letter-spacing:.06em;pointer-events:none;text-transform:uppercase;font-variant-numeric:tabular-nums}
.hud div{display:flex;flex-direction:column;gap:calc(var(--u)*1)}
.hud .lab{opacity:.85;font-weight:600}
.hud b{font-weight:700}
.coin-ico{display:inline-block;width:calc(var(--u)*4);height:calc(var(--u)*6);background:var(--gold);box-shadow:0 0 0 calc(var(--u)*1) #6b3f06;margin-right:calc(var(--u)*3);vertical-align:-4%}
.toast{position:absolute;left:50%;top:calc(var(--u)*30);transform:translateX(-50%);background:rgba(6,14,26,.82);border:calc(var(--u)*1) solid rgba(127,224,255,.45);color:#e6fbff;font-size:calc(var(--u)*7.5);padding:calc(var(--u)*4) calc(var(--u)*8);white-space:nowrap;pointer-events:none;letter-spacing:.03em}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);text-align:center;padding:calc(var(--u)*16);cursor:pointer}
.screen.solid{background:#05080d;cursor:default}
.screen.dim{background:rgba(5,8,13,.55)}
.card{background:rgba(8,14,24,.74);border:calc(var(--u)*1) solid rgba(255,255,255,.14);padding:calc(var(--u)*12) calc(var(--u)*18);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);max-width:calc(var(--u)*250)}
.screen h1{margin:0;font-size:calc(var(--u)*30);line-height:.92;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 calc(var(--u)*2) 0 var(--gold-deep),0 calc(var(--u)*4) 0 rgba(0,0,0,.45);text-wrap:balance}
.screen h2{margin:0;font-size:calc(var(--u)*18);font-weight:700;color:var(--fg);text-wrap:balance;line-height:1.05}
.screen p{margin:0;font-size:calc(var(--u)*8);line-height:1.35;color:var(--fg)}
.kicker{text-transform:uppercase;letter-spacing:.14em;color:var(--coral)!important;font-weight:600}
.lore{color:var(--muted)!important;max-width:calc(var(--u)*210)}
.sub{color:var(--muted)!important}
.blink{color:var(--gold)!important;font-weight:700;animation:blink 1.1s steps(2,start) infinite}
.lives{display:flex;align-items:center;gap:calc(var(--u)*6);font-size:calc(var(--u)*10)!important}
.lives canvas{width:calc(var(--u)*16);height:calc(var(--u)*16);image-rendering:pixelated}
.keys{color:var(--muted)!important;font-size:calc(var(--u)*6.5)!important}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;font-size:13px;color:var(--muted);max-width:720px}
.bar kbd{font-family:var(--ui);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--fg)}
.bar .btns{display:flex;gap:8px}
.bar button{font:600 13px var(--ui);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
.bar button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pad{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
.pad .grp{display:flex;gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--fg);font:700 14px var(--ui);touch-action:none;display:grid;place-items:center;padding:0}
.pad button.wings{background:#2a2414;border-color:#8a6a24;color:#ffd98a;font-size:12px}
.pad button.jump{background:#3a2412;border-color:#7a4a1e}
.pad button.on{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.pad svg{width:26px;height:26px;fill:currentColor}
@media (orientation:landscape) and (max-height:520px) and (pointer:coarse){.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6}.bar button{opacity:.75;padding:4px 8px;font-size:12px}}
.pad.overlay{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:none;padding-inline:20px;box-sizing:border-box;pointer-events:none}
.pad.overlay button{pointer-events:auto;opacity:.6;width:64px;height:64px}
</style>
</head>

    <div class="toast" id="toast" hidden></div>

    at(x, y, s) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') m[y][x + i] = s[i]; return api; },

    down(x, n) { for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) m[12 - j][x + i] = 'S'; return api; },

    R(...xs) { xs.forEach(x => api.e(x, true)); return api; },
    flag(x) { L.flag = x; m[12][x] = 'S'; return api; },
    ahu(x) { L.ahu = x; for (let i = 0; i < 9; i++) m[12][x + i] = 'A'; return api; },

    done() { return L; }
  };

}

  if (G.state !== 'title') drawPlayer(cx);
  for (const b of L.bullets) {
    const x = Math.round(b.x - cx), y = Math.round(b.y);
    ctx.fillStyle = 'rgba(255,200,80,.45)'; ctx.fillRect(x - Math.sign(b.vx) * 6, y, 6, 1);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(x - 1, y - 1, 4, 2);
  }
  for (const a of L.arrows) {
    const m = Math.hypot(a.vx, a.vy) || 1, ux = a.vx / m, uy = a.vy / m;
    for (let i = 0; i < 11; i++) {
      const px = Math.round(a.x - ux * i - cx), py = Math.round(a.y - uy * i);
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(px, py + 1, 1, 1);
      ctx.fillStyle = i < 2 ? '#e8ecf2' : i > 8 ? '#e2452f' : '#a8743a'; ctx.fillRect(px, py, 1, 1);
    }
    ctx.fillStyle = '#e8ecf2'; ctx.fillRect(Math.round(a.x - cx) - 1, Math.round(a.y) - 1, 2, 2);
  }
  for (const s of L.shards) {
    const x = Math.round(s.x - cx), y = Math.round(s.y), r = (s.t >> 2) & 1;
    ctx.fillStyle = '#ffb35a'; ctx.fillRect(x - 1, y - 1, 8, 8);
    ctx.fillStyle = '#15121d'; if (r) { ctx.fillRect(x + 1, y, 4, 6); ctx.fillRect(x, y + 1, 6, 4); } else { ctx.fillRect(x, y + 2, 6, 2); ctx.fillRect(x + 2, y, 2, 6); ctx.fillRect(x + 1, y + 1, 4, 4); }
    ctx.fillStyle = '#9aa6d6'; ctx.fillRect(x + 1, y + 1, 1, 1);
  }
  for (const p of L.parts) {
    const x = Math.round(p.x - cx), y = Math.round(p.y);
    if (p.s) { ctx.fillStyle = p.c; ctx.fillRect(x, y, p.s, p.s); }
    else { ctx.fillStyle = p.d; ctx.fillRect(x, y, 7, 7); ctx.fillStyle = p.c; ctx.fillRect(x, y, 6, 6); }
  }
  for (const p of L.pops) tinyText(p.text, p.x - cx, p.y);
  if (th.night) { ctx.fillStyle = 'rgba(10,20,60,.12)'; ctx.fillRect(0, 0, W, H); }
  if (G.state !== 'title') drawGhosts(cx);
  if (G.flagT > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, G.flagT / 20); drawSomFlag(W / 2 - 18, 40, 36, 24); ctx.restore(); }
}
function drawSmallCoin(x, y, t, danger) {
  const w = [6, 4, 2, 4][(t >> 2) & 3], x0 = Math.round(x + 3 - w / 2);
  if (danger) { ctx.fillStyle = (t >> 2) & 1 ? '#ff3b24' : '#b0180c'; ctx.fillRect(x0 - 1, y - 1, w + 2, 10); }
  ctx.fillStyle = '#6b3f06'; ctx.fillRect(x0, y, w, 8);
  if (w > 2) { ctx.fillStyle = '#f5c542'; ctx.fillRect(x0 + 1, y + 1, w - 2, 6); ctx.fillStyle = '#fff1b0'; ctx.fillRect(x0 + 1, y + 2, 1, 3); }
}
function pcircleCtx(cx, cy, r, col) { ctx.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); ctx.fillRect(cx - w, cy + y, w * 2, 1); } }

let hudCache = '';
function updateHud() {
  if (!L || $('hud').hidden) return;
  const k = [G.score, G.coins, G.lvl, G.time, G.lives, P ? P.shield : 0, P ? Math.ceil(P.wings / 60) : 0, L.wingsUsed, P ? P.gun : 0, G.lit, G.killCount, P ? P.charged : 0].join('|');
  if (k === hudCache) return; hudCache = k;
  $('hScore').textContent = pad(G.score, 6);
  $('hCoins').textContent = pad(G.coins, 2);
  $('hLevel').textContent = (G.lvl + 1) + '/' + LEVELS.length;
  $('hTime').textContent = pad(G.time, 3);
  $('hLives').textContent = '×' + G.lives;
  $('hWave').textContent = P && P.charged ? 'Pronta' : '●'.repeat(G.killCount) + '○'.repeat(3 - G.killCount);
  $('hShieldLab').textContent = P && P.gun ? 'Arma' : 'Escudo';
  $('hShield').textContent = P && P.gun ? 'Chapéu' : P && P.shield > 0 ? '●'.repeat(P.shield) : '—';
}

/* ============ loop ============ */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= STEP) { update(); acc -= STEP; }
  render(); updateHud();
  requestAnimationFrame(frame);
}
loadLevel(false);
fit();
showScreen('title');
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
window.moaiBack = () => { if (G.state === 'play' && !G.paused) { togglePause(); return true; } return false; };
window.moaiPause = () => { if (G.state === 'play' && !G.paused) togglePause(); };
window.__moai = { G, get L() { return L; }, get P() { return P; }, inp };
})();
</script>
